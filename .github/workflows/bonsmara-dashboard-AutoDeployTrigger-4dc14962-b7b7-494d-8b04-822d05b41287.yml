name: Trigger auto deployment for bonsmara-dashboard

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bonsmara-dashboard-AutoDeployTrigger-4dc14962-b7b7-494d-8b04-822d05b41287.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BONSMARADASHBOARD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BONSMARADASHBOARD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BONSMARADASHBOARD_AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: inrmpacrjvp47qgkhppbo.azurecr.io
          username: ${{ secrets.BONSMARADASHBOARD_REGISTRY_USERNAME }}
          password: ${{ secrets.BONSMARADASHBOARD_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: inrmpacrjvp47qgkhppbo.azurecr.io/bonsmara-dashboard:${{ github.sha }}

      - name: Deploy image to Azure Container Apps
        run: az containerapp update --name bonsmara-dashboard --resource-group bonsmara-rg --image inrmpacrjvp47qgkhppbo.azurecr.io/bonsmara-dashboard:${{ github.sha }} --output none

